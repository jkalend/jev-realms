[package]
name = "realms-view"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
laya-realms = { path = "../../crates/core" }
bevy = { version = "0.19", default-features = false, features = [
    "2d",
    "png",
    "bevy_text",
    "tonemapping_luts",
    "zstd_rust",
] }
bevy_light_2d = "0.10"
# The core input::key parity path consumes crossterm key events; both crates
# pin the same version so KeyEvent is one type across the seam.
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"

[[bin]]
name = "realmscape"
path = "src/bin/realmscape.rs"
